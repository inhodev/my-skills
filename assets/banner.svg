    <text x="360" y="169" fill="#FFFFFF" font-size="64" font-weight="750" letter-spacing="-2">my-skills</text>
    <text x="362" y="220" fill="#AAB3D1" font-size="22" font-weight="400" letter-spacing="0.05">Reusable agent workflows for Codex · Claude Code · any harness</text>

    <g font-size="14" font-weight="600" fill="#D9DDF0" letter-spacing="0.15">
      <g>
        <rect x="362" y="258" width="118" height="34" rx="17" fill="#AAB3D1" fill-opacity="0.08" stroke="#AAB3D1" stroke-opacity="0.18"/>
        <circle cx="380" cy="275" r="3.5" fill="#7C5CFC"/>
        <text x="391" y="280">Korean-first</text>
